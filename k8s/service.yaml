apiVersion: v1
kind: Service
metadata:
  name: websocket-gateway
  namespace: banking
  labels:
    app: websocket-gateway
spec:
  type: LoadBalancer
  selector:
    app: websocket-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800 # 3 hours
